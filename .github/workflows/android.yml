name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: 'Allow an unsigned test build (NOT for sync testing)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lintDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

  build:
    name: Build ${{ matrix.abi }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key (only if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${{ inputs.allow_unsigned }}" != "true" ]; then
            echo "::error::Release keystore secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          else
            echo "::warning::Building unsigned test APK. NOT for Google Drive sync testing."
          fi
      - name: Print signing fingerprint
        if: ${{ env.KEYSTORE_PATH != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E 'SHA1|SHA-1'
      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3 4 5; do
            if ./gradlew assembleRelease -Pabi=${{ matrix.abi }} --stacktrace; then
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed; retrying in 45s (transient 429s happen under parallel matrix load)"
            sleep 45
          done
          exit 1
      - name: Name APK with ABI
        run: |
          for f in app/build/outputs/apk/release/*.apk; do
            mv "$f" "$(dirname "$f")/savelin-${{ github.ref_name }}-${{ matrix.abi }}.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist
      - name: Build release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREVIOUS="$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || true)"
          if [ -n "$PREVIOUS" ]; then
            RANGE="${PREVIOUS}..${TAG}"
            COMPARE="Full changelog: \`${PREVIOUS}...${TAG}\`"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..${TAG}"
            COMPARE="First tagged release."
          fi

          echo "# Savelin $TAG" > release-body.md
          echo "" >> release-body.md
          echo "A private, local-only visual bookmark app. Share a link, get a beautiful preview tile — no account, no analytics, no cloud." >> release-body.md
          echo "" >> release-body.md
          echo "## Downloads" >> release-body.md
          echo "" >> release-body.md
          echo "| ABI | File | Size | SHA-256 |" >> release-body.md
          echo "| --- | --- | ---: | --- |" >> release-body.md
          for apk in dist/*.apk; do
            name="$(basename "$apk")"
            abi="universal"
            for candidate in arm64-v8a armeabi-v7a x86_64 x86 universal; do
              case "$name" in *"-$candidate.apk") abi="$candidate";; esac
            done
            size="$(du -h "$apk" | cut -f1)"
            sum="$(sha256sum "$apk" | cut -d' ' -f1)"
            echo "| \`$abi\` | [$name](https://github.com/LinezLab/savelin/releases/download/$TAG/$name) | $size | \`$sum\` |" >> release-body.md
          done
          echo "" >> release-body.md
          echo "Pick \`universal\` if unsure. \`arm64-v8a\` is for most modern phones, \`armeabi-v7a\` for older 32-bit ARM devices, and the x86 builds are for emulators." >> release-body.md
          echo "" >> release-body.md
          echo "## Changelog" >> release-body.md
          echo "" >> release-body.md
          echo "$COMPARE" >> release-body.md
          echo "" >> release-body.md

          features="$(git log --pretty=format:'- %s (%h)' "$RANGE" | grep -iE '^- (feat|add|implement)|- Add ' || true)"
          fixes="$(git log --pretty=format:'- %s (%h)' "$RANGE" | grep -iE '^- (fix|correct|suppress)|- Fix ' || true)"
          other="$(git log --pretty=format:'- %s (%h)' "$RANGE" | grep -viE '^- (feat|fix|add|implement|correct|suppress)|- (Add|Fix) ' || true)"

          if [ -n "$features" ]; then echo "### Features" >> release-body.md; echo >> release-body.md; echo "$features" >> release-body.md; echo >> release-body.md; fi
          if [ -n "$fixes" ]; then echo "### Fixes" >> release-body.md; echo >> release-body.md; echo "$fixes" >> release-body.md; echo >> release-body.md; fi
          if [ -n "$other" ]; then echo "### Maintenance" >> release-body.md; echo >> release-body.md; echo "$other" >> release-body.md; echo >> release-body.md; fi

          echo "## Verify" >> release-body.md
          echo "" >> release-body.md
          echo '```sh' >> release-body.md
          echo 'sha256sum savelin-*.apk' >> release-body.md
          echo '```' >> release-body.md
          echo "" >> release-body.md
          echo "APKs are signed with the repository's release keystore. No preview is sent to any server unless you save a link, and you can turn network access off entirely in Settings." >> release-body.md
          cat release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: release-body.md
          generate_release_notes: false
